[workspace]
members = ["agentgen", "agentgen-cli"]
resolver = "2"

[workspace.dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
