[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgen"
version = "0.1.5"
description = "Python client for the AgentGen API — HTML to PDF and Image"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agentgen", "html-to-pdf", "html-to-image", "pdf", "screenshot"]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/Agent-Gen-com/agent-gen-lib"
Repository = "https://github.com/Agent-Gen-com/agent-gen-lib"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["agentgen"]
