name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            asset_name: agentgen-x86_64-macos
            use_cross: false

          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_name: agentgen-aarch64-macos
            use_cross: false

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: agentgen-x86_64-linux
            use_cross: false

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: agentgen-aarch64-linux
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (aarch64 musl)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} --manifest-path rust/agentgen-cli/Cargo.toml

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --manifest-path rust/agentgen-cli/Cargo.toml

      - name: Package tarball
        run: |
          cp rust/agentgen-cli/target/${{ matrix.target }}/release/agentgen agentgen
          tar czf ${{ matrix.asset_name }}.tar.gz agentgen

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true

      - name: Update Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#cli-v}"

          # Extract SHA256s from checksums.txt
          SHA_X86_MACOS=$(grep agentgen-x86_64-macos.tar.gz artifacts/checksums.txt | awk '{print $1}')
          SHA_AARCH64_MACOS=$(grep agentgen-aarch64-macos.tar.gz artifacts/checksums.txt | awk '{print $1}')
          SHA_X86_LINUX=$(grep agentgen-x86_64-linux.tar.gz artifacts/checksums.txt | awk '{print $1}')
          SHA_AARCH64_LINUX=$(grep agentgen-aarch64-linux.tar.gz artifacts/checksums.txt | awk '{print $1}')

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Agent-Gen-com/homebrew-agentgen.git" tap
          cd tap

          sed -i \
            -e "s|PLACEHOLDER_VERSION|${VERSION}|g" \
            -e "s|PLACEHOLDER_TAG|${TAG}|g" \
            -e "s|PLACEHOLDER_SHA_X86_MACOS|${SHA_X86_MACOS}|g" \
            -e "s|PLACEHOLDER_SHA_AARCH64_MACOS|${SHA_AARCH64_MACOS}|g" \
            -e "s|PLACEHOLDER_SHA_X86_LINUX|${SHA_X86_LINUX}|g" \
            -e "s|PLACEHOLDER_SHA_AARCH64_LINUX|${SHA_AARCH64_LINUX}|g" \
            Formula/agentgen.rb

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/agentgen.rb
          git commit -m "agentgen ${VERSION}"
          git push
