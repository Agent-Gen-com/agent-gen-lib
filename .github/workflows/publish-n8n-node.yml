name: Publish n8n-nodes-agentgen to npm

on:
  push:
    tags:
      - 'n8n-v*'   # trigger on tags like n8n-v0.1.0, n8n-v1.0.0, etc.

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    # id-token: required for npm provenance (mandatory from May 1 2026)
    # contents: write: required to commit built dist/ back to the repo
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can push back to main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: n8n/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: n8n

      - name: Build
        run: npm run build
        working-directory: n8n

      - name: Lint
        run: npm run lint
        working-directory: n8n

      - name: Sync dist to repo root (required for n8n verifier)
        run: |
          # n8n's verification checks raw.githubusercontent.com/{repo}/main/dist/...
          # (without applying repository.directory). We keep a copy at the root.
          rm -rf dist/credentials dist/nodes
          cp -r n8n/dist/credentials dist/credentials
          cp -r n8n/dist/nodes dist/nodes

      - name: Commit built dist/ to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add n8n/dist/ dist/credentials/ dist/nodes/
          # Only commit if there are changes (idempotent)
          git diff --staged --quiet || git commit -m "chore: update n8n dist for ${{ github.ref_name }}"
          git push origin HEAD:main

      - name: Publish with provenance
        run: npm publish --provenance --access public
        working-directory: n8n
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
